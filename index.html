<!DOCTYPE html>
<html lang="es">
<head>

<style>
  :root {
    --hdr:#0f1115; --hdr-ink:#ffffff; --hdr-mute:#a3abb8;
    --bg:#f3f4f6; --card:#ffffff; --ink:#15181d; --mute:#6b7280; --line:#e5e7eb;
    --acc:#2f5fd0; --acc2:#e9effd; --ok:#1f9d55; --ok2:#e3f5ea; --warn:#c2410c; --warn2:#fdeee4; --bad:#c81e1e; --bad2:#fde8e8;
    --navh:56px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b0d10; --card:#171a20; --ink:#eef0f3; --mute:#9aa3af; --line:#272c34;
            --acc:#6d95ff; --acc2:#1d2740; --ok:#3ccf7c; --ok2:#123222; --warn:#fb923c; --warn2:#3a2414; --bad:#f87171; --bad2:#3b1717; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); -webkit-text-size-adjust:100%; }
  body { margin:0; min-height:100vh; overflow-x:hidden; font:16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         background:var(--bg); color:var(--ink); overscroll-behavior-y:none; }
  /* ---------- cabecera oscura (también cubre la zona de la hora y la batería) ---------- */
  header { position:sticky; top:0; z-index:10; background:var(--hdr); color:var(--hdr-ink);
           padding:calc(env(safe-area-inset-top) + 8px) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
           display:grid; grid-template-columns:88px 1fr 88px; align-items:center; height:calc(env(safe-area-inset-top) + 58px); box-sizing:border-box; }
  header h1 { grid-column:2; font-size:17px; font-weight:700; margin:0; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .sub { display:block; font-size:11px; font-weight:500; color:var(--hdr-mute); text-align:center; }
  .hbtn { background:transparent; color:var(--hdr-ink); padding:0 6px; font-size:16px; font-weight:600; border-radius:10px; height:40px; line-height:40px; }
  .hbtn.l { justify-self:start; display:flex; align-items:center; gap:2px; }
  .hbtn.r { justify-self:end; color:#9fb8ff; }
  .hbtn svg { width:22px; height:22px; }
  main { padding:8px max(12px, env(safe-area-inset-right)) calc(var(--navh) + env(safe-area-inset-bottom) + 24px) max(12px, env(safe-area-inset-left)); }
  body.timer-on main { padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 96px); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
  .row { display:flex; align-items:center; gap:8px; }
  .mute { color:var(--mute); font-size:13px; }
  button { font:inherit; border:0; border-radius:12px; padding:12px 14px; background:var(--acc2); color:var(--acc); font-weight:600; cursor:pointer; touch-action:manipulation; }
  button.prim { background:var(--acc); color:#fff; }
  button.ghost { background:transparent; color:var(--mute); padding:10px 8px; }
  button.danger { background:transparent; color:var(--bad); }
  button.dangerfill { background:var(--bad); color:#fff; }
  button.step { width:56px; height:56px; font-size:26px; padding:0; }
  button:active { filter:brightness(.92); }
  .ok { width:100%; height:60px; font-size:19px; margin-top:12px; }
  .pair { display:flex; gap:10px; margin-top:14px; }
  .pair button { flex:1; height:52px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chip { padding:9px 14px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:500; }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .ex { padding:12px 14px; }
  .ex .t { font-weight:600; flex:1; }
  .ex.cur { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc2); }
  .ex.done .t { color:var(--mute); }
  .ex.done .badge { background:var(--ok2); color:var(--ok); }

  .val small { color:var(--mute); font-size:12px; }
  .hint { margin-top:10px; width:100%; text-align:left; }
  .foot { display:flex; gap:10px; margin:14px 0 6px; }

  .lnk { display:block; width:100%; text-align:center; margin:4px 0 8px; }
  /* ---------- barra de navegación inferior (estilo tab bar iOS: 56 px + zona del indicador de inicio) ---------- */
  nav { position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex; background:var(--card); border-top:1px solid var(--line);
        height:calc(var(--navh) + env(safe-area-inset-bottom)); padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  nav button svg { width:26px; height:26px; }
  nav button.on { color:var(--acc); }
  /* ---------- cronómetro de descanso ---------- */
  #timer { position:fixed; z-index:9; left:max(12px, env(safe-area-inset-left)); right:max(12px, env(safe-area-inset-right));
           bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 10px); display:none; align-items:center; gap:10px;
           background:var(--hdr); color:#fff; border-radius:16px; padding:10px 10px 10px 16px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  body.timer-on #timer { display:flex; }
  #timer .tt { flex:1; min-width:0; }
  #timer .lbl { font-size:12px; color:var(--hdr-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #timer .clk { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.5px; line-height:1.1; }
  #timer.mid .clk { color:#ffd166; }
  #timer.long .clk { color:#ff8a65; }
  #timer button { background:rgba(255,255,255,.12); color:#fff; height:44px; padding:0 14px; }
  /* ---------- hojas modales, avisos ---------- */
  .modal { position:fixed; left:0; right:0; top:0; height:var(--vvh, 100%); background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:30; }
  .modal.on { display:flex; animation:aparece .18s ease-out; }
  .modal.on .sheet { animation:sube .26s cubic-bezier(.2,.8,.2,1); }
  .modal.sale { animation:desaparece .16s ease-in forwards; }
  .modal.sale .sheet { animation:baja .16s ease-in forwards; }
  .modal.arriba { align-items:flex-start; }
  #kpis small { font-size:13px; font-weight:600; color:var(--mute); }
  .modal.arriba .sheet { border-radius:0 0 18px 18px; padding-top:calc(env(safe-area-inset-top) + 14px); height:calc(var(--vvh, 100vh) - 40px); max-height:none;
                         display:flex; flex-direction:column; padding-bottom:12px; }
  .modal.arriba.on .sheet { animation:bajaDe .26s cubic-bezier(.2,.8,.2,1); }
  .modal.arriba.sale .sheet { animation:subeA .16s ease-in forwards; }
  .modal.arriba #res { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; margin-top:6px; }
  @keyframes aparece { from { opacity:0; } }
  @keyframes desaparece { to { opacity:0; } }
  @keyframes sube { from { transform:translateY(100%); } }
  @keyframes baja { to { transform:translateY(100%); } }
  @keyframes bajaDe { from { transform:translateY(-100%); } }
  @keyframes subeA { to { transform:translateY(-100%); } }
  /* ---------- animaciones suaves ---------- */
  main.entra { animation:entra .22s ease-out; }
  @keyframes entra { from { opacity:0; transform:translateY(8px); } }
  .toast.ver { animation:pop .22s cubic-bezier(.2,.9,.3,1.3); }
  @keyframes pop { from { opacity:0; transform:translate(-50%, 10px) scale(.96); } }
  .card.nueva { animation:entra .25s ease-out; }
  button { transition:transform .08s ease, background-color .15s ease, opacity .15s ease; }
  button:active { transform:scale(.97); }
  #timer { transition:transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  .sheet { background:var(--card); width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0;
           padding:18px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .sheet h3 { margin:0 0 6px; font-size:19px; }
  input[type=search], input[type=text], select { width:100%; font:inherit; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  label.f { display:block; margin:10px 0 4px; color:var(--mute); font-size:13px; }
  .li { padding:12px 4px; border-bottom:1px solid var(--line); }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 16px); z-index:40;
           background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:15px; font-weight:600; display:none; max-width:90vw; text-align:center; }
  body.timer-on .toast { bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 96px); }
  .toast.ok { background:var(--ok); color:#fff; }
  .toast.err { background:var(--bad); color:#fff; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; font-weight:700; margin-top:2px; }
  .pill.pend { background:#ffedd5; color:#9a3412; }
  .pill.sync { background:rgba(255,255,255,.12); color:var(--hdr-mute); }
  canvas { max-width:100%; }
  .loading { text-align:center; padding:60px 0; color:var(--mute); }
  .mini { background:transparent; color:var(--mute); padding:2px 8px; font-size:20px; line-height:1; border-radius:8px; }
  .nota { margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--warn2); color:var(--ink); font-size:14px; white-space:pre-wrap; }
  .nota.vacia { background:transparent; color:var(--mute); padding:4px 0; font-size:13px; }
  .set.pr { border-color:#d4a106; background:#fff7d6; color:#7a5a00; }
  @media (prefers-color-scheme: dark) { .set.pr { background:#3a3010; color:#ffd166; } }
  .aviso { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-top:1px solid var(--line); }
  .aviso:first-of-type { border-top:0; }
  .dias { font-weight:700; color:var(--warn); white-space:nowrap; margin-left:8px; }
  .stat { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .stat div { background:var(--bg); border-radius:12px; padding:10px; }
  .stat b { display:block; font-size:20px; }
  .up { color:var(--ok); } .down { color:var(--bad); }
  textarea { width:100%; min-height:110px; font:inherit; font-size:16px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .hero { font-size:28px; font-weight:800; margin:4px 0 10px; }
  .banner { border-radius:12px; padding:12px; margin:10px 0; font-size:14px; }
  .banner.ok { background:var(--ok2); color:var(--ok); }
  /* ---------- solo vertical: en horizontal se pide girar el móvil ---------- */
  #girar { display:none; }
  @media (orientation: landscape) and (max-height: 520px) {
    #girar { display:flex; position:fixed; inset:0; z-index:100; background:var(--hdr); color:#fff; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-weight:600; }
    #girar svg { width:56px; height:56px; }
  }
</style>

<header>
  <div id="hL"></div>
  <h1><span id="titulo">Gym</span><span class="sub" id="hSub"></span></h1>
  <div id="hR" style="justify-self:end"></div>
</header>

  <button onclick="reiniciarDescanso()" aria-label="Reiniciar">↺</button>

</div>

<nav>
  <button id="nHoy" class="on" onclick="ir('hoy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Entreno</button>
  <button id="nProg" onclick="ir('prog')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M4 16l5-5 4 3 7-8"/></svg>Progreso</button>
  <button id="nHist" onclick="ir('hist')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Historial</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this && !this.dataset.fijo)cerrar()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>/**
 * Motor de predicción (funciones puras, sin dependencias de Google).
 * Validado contra el histórico (5.153 series): peso exacto en el 76,5 % y peso exacto con ±1 rep en el 64,7 %.
 *
 * Una "sesión" de un ejercicio es: { fecha: 'yyyy-mm-dd', sets: [{ serie, peso, reps }] }
 * con solo las series efectivas (1er tramo, sin calentamiento), ordenadas por serie.
 */

/** Sugerencia para la serie número `k` (1, 2, 3...) de hoy. */
function sugerirSerie(historial, hoy, k, cfg) {
  cfg = cfg || {};
  var repsMax = cfg.repsMax || 12, repsMin = cfg.repsMin || 8;
  var L = ultimaSesion(historial);
  var prevHoy = hoy.length ? hoy[hoy.length - 1] : null;
  if (!L) {
    // Ejercicio sin historial: repetir lo de hoy o dejar vacío.
    return prevHoy ? { peso: prevHoy.peso, reps: prevHoy.reps, motivo: 'Igual que la serie anterior' }
                   : { peso: null, reps: null, motivo: 'Sin historial: introduce peso y reps' };
  }
  var Lk = L.sets[k - 1], Lprev = L.sets[k - 2];
  if (k === 1 || !prevHoy) {
    if (!Lk) Lk = L.sets[0];
    return { peso: Lk.peso, reps: Lk.reps, motivo: 'Como el ' + fechaCorta(L.fecha) };
  }
  if (!Lk) {
    // Hoy haces más series que la última vez: misma carga y caída típica de reps.
    var d = caidaTipica(historial);
    return { peso: prevHoy.peso, reps: limitar(prevHoy.reps + d, 1, repsMax), motivo: 'Serie extra: caída típica de ' + d + ' rep' };
  }
  // Series 2+: mismo peso que la serie anterior de hoy (acierta el 76,5 % frente al 72,5 % de copiar la última sesión).
  var peso = esNum(prevHoy.peso) ? prevHoy.peso : Lk.peso;
  var reps = Lk.reps;
  if (Lprev && prevHoy.peso === Lprev.peso && esNum(prevHoy.reps) && esNum(Lprev.reps)) {
    reps = Lk.reps + (prevHoy.reps - Lprev.reps);   // hoy vas mejor/peor que la última vez
  }
  return { peso: peso, reps: limitar(reps, 1, Math.max(repsMax, Lk.reps)), motivo: 'Como el ' + fechaCorta(L.fecha) + ', ajustado a tu serie anterior' };
}

/** Propuesta de progresión (doble progresión) para mostrar como botón aparte. */
function sugerirProgresion(historial, cfg) {
  cfg = cfg || {};
  var repsMax = cfg.repsMax || 12, incremento = cfg.incremento || 2.5;
  var L = ultimaSesion(historial);
  if (!L || !L.sets.length || !esNum(L.sets[0].peso)) return null;
  var W = L.sets[0].peso;
  var aW = L.sets.filter(function (s) { return s.peso === W; });
  if (!aW.length || !aW.every(function (s) { return s.reps >= repsMax; })) return null;
  var usados = pesosUsados(historial).filter(function (p) { return p > W; });
  var W2 = usados.length ? usados[0] : redondear(W + incremento);
  var e = W * (1 + aW[0].reps / 30);
  var r = limitar(Math.round(30 * (e / W2 - 1)), 1, repsMax);
  return { peso: W2, reps: r, motivo: 'Llegaste a ' + repsMax + ' en todas las series con ' + fmt(W) + ' kg' };
}

/**
 * Ajuste de reps por el descanso actual frente a tu descanso típico, con el modelo aprendido en el servidor
 * (modeloDescanso_). Devuelve 0 mientras no haya al menos 15 muestras en los dos tramos comparados.
 */
function ajusteDescanso(m, seg) {
  if (!m || !m.tipico || seg === null || seg === undefined) return 0;
  var t = function (s) { return s < m.limites[0] ? 0 : s < m.limites[1] ? 1 : s < m.limites[2] ? 2 : 3; };
  var a = m.tramos[t(seg)], b = m.tramos[t(m.tipico)];
  if (!a || !b || a.n < 15 || b.n < 15) return 0;
  return Math.max(-2, Math.min(1, Math.round(a.media - b.media)));
}

/** e1RM de Epley. */
function e1rm(carga, reps) {
  if (!esNum(carga) || !esNum(reps) || carga <= 0 || reps > 15) return null;
  return Math.round(carga * (1 + reps / 30) * 10 + 1e-9) / 10;
}

function ultimaSesion(historial) {
  for (var i = historial.length - 1; i >= 0; i--) if (historial[i].sets && historial[i].sets.length) return historial[i];
  return null;
}
function caidaTipica(historial) {
  var d = [];
  historial.slice(-10).forEach(function (s) {
    for (var i = 1; i < s.sets.length; i++) if (s.sets[i].peso === s.sets[i - 1].peso) d.push(s.sets[i].reps - s.sets[i - 1].reps);
  });
  if (!d.length) return 0;
  d.sort(function (a, b) { return a - b; });
  return d[Math.floor(d.length / 2)];
}
function pesosUsados(historial) {
  var m = {};
  historial.forEach(function (s) { s.sets.forEach(function (x) { if (esNum(x.peso)) m[x.peso] = 1; }); });
  return Object.keys(m).map(Number).sort(function (a, b) { return a - b; });
}
function esNum(x) { return typeof x === 'number' && !isNaN(x); }
function limitar(x, lo, hi) { return Math.max(lo, Math.min(hi, Math.round(x))); }
function redondear(x) { return Math.round(x * 4) / 4; }
function fmt(x) { return String(x).replace('.', ','); }
function fechaCorta(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
</script>
<script>
// ============================================================ conexión con el servidor
// Modo 'gas': la página la sirve Apps Script (google.script.run).
// Modo 'api': la página está alojada fuera (GitHub Pages) y llama a la API de Apps Script con fetch.
var MODO = (typeof google !== 'undefined' && google.script && google.script.run) ? 'gas' : 'api';
var K_CONEX = 'gym_conexion_v1', K_COLA = 'gym_cola_v1', K_EST = 'gym_estado_v1', K_DESC = 'gym_descanso_v1', K_CERR = 'gym_cerradas_v2';   // K_CERR: ids de sesión cerradas

function lsGet(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function conexion() { return lsGet(K_CONEX, {}); }
(function leerHash() {
  var h = location.hash || '', k = /[#&]key=([^&]+)/.exec(h), u = /[#&]api=([^&]+)/.exec(h);
  if (!k && !u) return;
  var c = conexion(); if (k) c.key = decodeURIComponent(k[1]); if (u) c.url = decodeURIComponent(u[1]); lsSet(K_CONEX, c);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
})();
function apiUrl() { return conexion().url || window.GYM_API_URL || ''; }

function call(fn, args) {
  return new Promise(function (res, rej) {
    var req = { fn: fn, args: args || [], key: conexion().key || '' };

  var topMax = Math.max.apply(null, p.map(function (x) { return x.top || 0; }));
  $('kpis').innerHTML = kpi('Peso máx.', n2(topMax) + '<small> kg</small>') + kpi('Último', n2(last.top) + '<small> kg</small>') +
    kpi('e1RM máx.', n2(best)) + kpi('Sesiones', p.length);
  var es = estancamiento(p.filter(function (x) { return x.e1rm; }));
  $('estEj').innerHTML = es ? '<div class="banner" style="background:var(--warn2);color:var(--warn)">⚠ ' + es.sesiones + ' sesiones sin superar tu mejor marca (' + n2(es.mejor) + ' kg el ' + dm(es.fecha) + '/' + es.fecha.slice(2, 4) + ').</div>' : '';
  if (chart) chart.destroy();
  if (typeof Chart === 'undefined') return;
  var css = getComputedStyle(document.documentElement);
  chart = new Chart($('cv'), { type: 'line', data: { labels: p.map(function (x) { return dm(x.fecha) + '/' + x.fecha.slice(2, 4); }),
    datasets: [{ label: 'Peso levantado (kg)', data: p.map(function (x) { return x.top; }), borderColor: css.getPropertyValue('--acc').trim(), backgroundColor: css.getPropertyValue('--acc').trim(), pointRadius: 2.5, borderWidth: 2.5, tension: .2, spanGaps: true },
               { label: 'e1RM estimado (kg)', data: p.map(function (x) { return x.e1rm; }), borderColor: '#e07b39', backgroundColor: '#e07b39', borderDash: [4, 4], pointRadius: 0, borderWidth: 1.5, tension: .2, spanGaps: true }] },
    options: { animation: { duration: 350 }, interaction: { mode: 'index', intersect: false },
               plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: function (c) { return ' ' + c.dataset.label.replace(' (kg)', '') + ': ' + n2(c.parsed.y) + ' kg'; } } } },
               scales: { x: { ticks: { maxTicksLimit: 6 } } } } });
}
function kpi(l, v) { return '<div><div class="mute" style="font-size:13px">' + l + '</div><div style="font-size:20px;font-weight:700;white-space:nowrap">' + v + '</div></div>'; }

// ============================================================ historial (se pinta al instante desde lo guardado y se refresca detrás)
function sesionesHistorial() {
  var l = (E.historialSesiones || []).filter(function (s) { return s.fecha !== E.hoy; });
  sesionesConSeries().forEach(function (sid) { l.unshift({ sesion: sid, fecha: E.hoy, sets: E.hoySets.filter(function (x) { return x.sesion === sid; }) }); });
  return l.slice(0, 10);
}
function pintarHistorial() {
  cabecera('Historial');
  dibujarHistorial(sesionesHistorial());
  run('getHistorial', [10], function (ses) {
    E.historialSesiones = ses; lsSet(K_EST, E);
    if (S.vista === 'hist') dibujarHistorial(sesionesHistorial());
  }, function () {});
}
function dibujarHistorial(ses) {
  $('app').innerHTML = '<p class="mute" style="margin:8px 4px">Toca una serie para corregirla o borrarla.</p>' + (ses.map(function (s) {
    var por = {}; s.sets.forEach(function (x) { (por[x.ej] = por[x.ej] || []).push(x); });
    var t = tipoDe(s.sesion);
    return '<div class="card"><b>' + s.fecha.split('-').reverse().join('/') + '</b>' + (t && t !== 'Descartada' ? ' <span class="mute">· ' + esc(t) + '</span>' : '') + Object.keys(por).map(function (id) {
      var e = ej(id);
      return '<div style="margin-top:8px">' + esc(e.nombre) + '<div class="sets">' + por[id].map(function (x) {
        return x.id ? '<span class="set" onclick="editar(\'' + x.id + '\',\'' + id + '\',' + (x.peso == null ? 'null' : x.peso) + ',' + x.reps + ')">' + etiquetaSerie(e, x) + '</span>'
                    : '<span class="set p">' + etiquetaSerie(e, x) + '</span>';
      }).join('') + '</div></div>';
    }).join('') + '</div>';
  }).join('') || '<p class="mute">Sin sesiones.</p>');
}
function editar(id, ejId, peso, reps) {
  var e = ej(ejId), sinPeso = e.tipoCarga === 'reps' || e.tipoCarga === 'segs';
  abrirHoja('<h3>' + esc(e.nombre) + '</h3><div class="row">' +
    (sinPeso ? '' : '<div style="flex:1"><label class="f">' + esc(unidad(e)) + '</label><input type="text" id="ep" inputmode="decimal" value="' + n2(peso) + '"></div>') +
    '<div style="flex:1"><label class="f">' + (e.tipoCarga === 'segs' ? 'segundos' : 'reps') + '</label><input type="text" id="er" inputmode="numeric" value="' + n2(reps) + '"></div></div>' +
    '<div class="pair"><button onclick="cerrar()">Cancelar</button><button class="prim" onclick="guardarEdicion(\'' + id + '\')">Guardar</button></div>' +
    '<button class="ghost danger lnk" style="margin-top:10px" onclick="borrarHist(\'' + id + '\')">Borrar serie</button>');
}
function guardarEdicion(id) {
  var p = $('ep') ? parseFloat($('ep').value.replace(',', '.')) : '', r = parseFloat($('er').value.replace(',', '.'));
  if (!r) { toast('Reps no válidas', 'err'); return; }
  run('editarSerie', [id, p, r], function () { cambiarLocal(id, function (x) { x.peso = p === '' ? null : p; x.reps = r; }); cerrar(); toast('✓ Cambios guardados', 'ok'); pintar(); });
}
/** Aplica una edición (fn) o un borrado (fn = null) a la serie en las copias locales. */
function cambiarLocal(id, fn) {
  [E.hoySets].concat((E.historialSesiones || []).map(function (s) { return s.sets; })).forEach(function (l) {
    for (var i = l.length - 1; i >= 0; i--) if (l[i].id === id) { if (fn) fn(l[i]); else l.splice(i, 1); }
  });
  lsSet(K_EST, E);
}
function borrarHist(id) {
  confirmar('¿Borrar esta serie?', 'Se marcará como borrada en la hoja.', 'Borrar', true, function () {
    run('borrarSerie', [id], function () { cambiarLocal(id, null); toast('Serie borrada'); pintar(); });
  });
}

// ============================================================ ajustes
var VERSION_APP = 'v4.2';
function pintarAjustes() {
  cabecera('Ajustes', '<button class="hbtn l" onclick="ir(\'hoy\')">' + ICON_ATRAS + 'Inicio</button>');
  $('app').innerHTML = '<div class="card"><h3 style="margin:0 0 4px">Peso corporal</h3>' +
    '<p class="mute" style="margin:0 0 8px">Se usa en los ejercicios con lastre o asistidos (fondos, dominadas). Las series ya guardadas no cambian.</p>' +
    '<div class="row"><input type="text" id="pc" inputmode="decimal" value="' + n2(E.cfg.pesoCorporal) + '" style="flex:1"><span class="mute">kg</span></div>' +
    '<button class="prim ok" onclick="guardarPeso()">Guardar peso</button></div>' +
    '<div class="card"><h3 style="margin:0 0 4px">Conexión</h3><p class="mute" style="margin:0">' + (MODO === 'gas' ? 'App servida por Apps Script.' : 'Conectada a tu hoja Gym v2.') + ' Versión ' + VERSION_APP + '.</p>' +
    (MODO === 'api' ? '<button class="ghost danger lnk" style="margin-top:10px" onclick="olvidarClave()">Olvidar la clave en este móvil</button>' : '') + '</div>';
}
function guardarPeso() {
  var kg = parseFloat(($('pc').value || '').replace(',', '.'));
  if (!(kg >= 30 && kg <= 250)) { toast('Peso no válido', 'err'); return; }
  run('guardarPesoCorporal', [kg], function () { E.cfg.pesoCorporal = kg; lsSet(K_EST, E); toast('✓ Peso corporal: ' + n2(kg) + ' kg', 'ok'); });
}
function olvidarClave() {
  confirmar('¿Olvidar la clave?', 'Tendrás que volver a escribirla para usar la app en este móvil.', 'Olvidar', true, function () {
    var c = conexion(); delete c.key; lsSet(K_CONEX, c); lsSet(K_EST, null); E = null; pantallaConexion('');
  });
}

// ============================================================ conexión (solo app instalada fuera de Google)
function pantallaConexion(motivo) {
  cabecera('Conectar');
  var c = conexion();
  $('app').innerHTML = '<div class="card"><h3 style="margin:0 0 6px">Conecta la app con tu hoja</h3>' +
    '<p class="mute" style="margin-top:0">' + (motivo && /CLAVE/.test(motivo) && c.key ? 'La clave no es correcta. ' : '') +
    'En el Sheet <b>Gym v2</b>, menú <b>Gym → Conectar el móvil</b>, copia la clave aquí. Solo hay que hacerlo una vez.</p>' +
    (window.GYM_API_URL || MODO === 'gas' ? '' : '<label class="f">URL de la API (termina en /exec)</label><input type="text" id="cu" value="' + esc(c.url || '') + '">') +
    '<label class="f">Clave</label><input type="text" id="ck" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" value="' + esc(c.key || '') + '">' +
    '<button class="prim ok" onclick="guardarConex()">Conectar</button></div>';
}
function guardarConex() {
  var c = conexion();
  if ($('cu')) c.url = $('cu').value.trim();
  c.key = $('ck').value.trim().toUpperCase();
  lsSet(K_CONEX, c); toast('Conectando…'); E = null; lsSet(K_EST, null); cargar();
}

tickDescanso();
cargar();
</script>
