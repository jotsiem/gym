  nav { position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex; background:var(--card); border-top:1px solid var(--line);
        height:calc(var(--navh) + env(safe-area-inset-bottom)); padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  #timer { position:fixed; z-index:9; left:max(12px, env(safe-area-inset-left)); right:max(12px, env(safe-area-inset-right));

  body.timer-on #timer { display:flex; }

  #timer .clk { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.5px; line-height:1.1; }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:flex-end; z-index:30; }

  .sheet { background:var(--card); width:100%; max-height:88vh; overflow:auto; border-radius:18px 18px 0 0;

  .sheet h3 { margin:0 0 6px; font-size:19px; }
  input[type=search], input[type=text], select { width:100%; font:inherit; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }

  .li { padding:12px 4px; border-bottom:1px solid var(--line); }

  body.timer-on .toast { bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 96px); }
  .toast.ok { background:var(--ok); color:#fff; }
  .toast.err { background:var(--bad); color:#fff; }
  .pill { display:inline-block; font-size:11px; padding:2px 8px; border-radius:99px; font-weight:700; margin-top:2px; }
  .pill.pend { background:#ffedd5; color:#9a3412; }
  .pill.sync { background:rgba(255,255,255,.12); color:var(--hdr-mute); }
  canvas { max-width:100%; }
  .loading { text-align:center; padding:60px 0; color:var(--mute); }
  .hero { font-size:28px; font-weight:800; margin:4px 0 10px; }
  .banner { border-radius:12px; padding:12px; margin:10px 0; font-size:14px; }
  .banner.ok { background:var(--ok2); color:var(--ok); }

  #girar { display:none; }

    #girar { display:flex; position:fixed; inset:0; z-index:100; background:var(--hdr); color:#fff; flex-direction:column; align-items:center; justify-content:center; gap:12px; font-weight:600; }
    #girar svg { width:56px; height:56px; }
  }
</style>

<script>/**
 * Motor de predicción (funciones puras, sin dependencias de Google).
 * Validado contra el histórico: el peso de cada serie se acierta exacto en ~78 % de los casos
 * y las reps con un error medio de ~0,4 cuando el peso coincide.
 *
 * Una "sesión" de un ejercicio es: { fecha: 'yyyy-mm-dd', sets: [{ serie, peso, reps }] }
 * con solo las series efectivas (1er tramo, sin calentamiento), ordenadas por serie.
 */

/** Sugerencia para la serie número `k` (1, 2, 3...) de hoy. */
function sugerirSerie(historial, hoy, k, cfg) {
  cfg = cfg || {};
  var repsMax = cfg.repsMax || 12, repsMin = cfg.repsMin || 8;
  var L = ultimaSesion(historial);
  var prevHoy = hoy.length ? hoy[hoy.length - 1] : null;
  if (!L) {
    // Ejercicio sin historial: repetir lo de hoy o dejar vacío.
    return prevHoy ? { peso: prevHoy.peso, reps: prevHoy.reps, motivo: 'Igual que la serie anterior' }
                   : { peso: null, reps: null, motivo: 'Sin historial: introduce peso y reps' };
  }
  var Lk = L.sets[k - 1], Lprev = L.sets[k - 2];
  if (k === 1 || !prevHoy) {
    if (!Lk) Lk = L.sets[0];
    return { peso: Lk.peso, reps: Lk.reps, motivo: 'Como el ' + fechaCorta(L.fecha) };
  }
  if (!Lk) {
    // Hoy haces más series que la última vez: misma carga y caída típica de reps.
    var d = caidaTipica(historial);
    return { peso: prevHoy.peso, reps: limitar(prevHoy.reps + d, 1, repsMax), motivo: 'Serie extra: caída típica de ' + d + ' rep' };
  }
  var peso = (Lprev && esNum(prevHoy.peso) && esNum(Lk.peso) && esNum(Lprev.peso))
      ? redondear(prevHoy.peso + (Lk.peso - Lprev.peso)) : Lk.peso;
  var reps = Lk.reps;
  if (Lprev && prevHoy.peso === Lprev.peso && esNum(prevHoy.reps) && esNum(Lprev.reps)) {
    reps = Lk.reps + (prevHoy.reps - Lprev.reps);   // hoy vas mejor/peor que la última vez
  }
  return { peso: peso, reps: limitar(reps, 1, Math.max(repsMax, Lk.reps)), motivo: 'Como el ' + fechaCorta(L.fecha) + ', ajustado a tu serie anterior' };
}

/** Propuesta de progresión (doble progresión) para mostrar como botón aparte. */
function sugerirProgresion(historial, cfg) {
  cfg = cfg || {};
  var repsMax = cfg.repsMax || 12, incremento = cfg.incremento || 2.5;
  var L = ultimaSesion(historial);
  if (!L || !L.sets.length || !esNum(L.sets[0].peso)) return null;
  var W = L.sets[0].peso;
  var aW = L.sets.filter(function (s) { return s.peso === W; });
  if (!aW.length || !aW.every(function (s) { return s.reps >= repsMax; })) return null;
  var usados = pesosUsados(historial).filter(function (p) { return p > W; });
  var W2 = usados.length ? usados[0] : redondear(W + incremento);
  var e = W * (1 + aW[0].reps / 30);
  var r = limitar(Math.round(30 * (e / W2 - 1)), 1, repsMax);
  return { peso: W2, reps: r, motivo: 'Llegaste a ' + repsMax + ' en todas las series con ' + fmt(W) + ' kg' };
}

/** e1RM de Epley. */
function e1rm(carga, reps) {
  if (!esNum(carga) || !esNum(reps) || carga <= 0 || reps > 15) return null;
  return Math.round(carga * (1 + reps / 30) * 10) / 10;
}

function ultimaSesion(historial) {
  for (var i = historial.length - 1; i >= 0; i--) if (historial[i].sets && historial[i].sets.length) return historial[i];
  return null;
}
function caidaTipica(historial) {
  var d = [];
  historial.slice(-10).forEach(function (s) {
    for (var i = 1; i < s.sets.length; i++) if (s.sets[i].peso === s.sets[i - 1].peso) d.push(s.sets[i].reps - s.sets[i - 1].reps);
  });
  if (!d.length) return 0;
  d.sort(function (a, b) { return a - b; });
  return d[Math.floor(d.length / 2)];
}
function pesosUsados(historial) {
  var m = {};
  historial.forEach(function (s) { s.sets.forEach(function (x) { if (esNum(x.peso)) m[x.peso] = 1; }); });
  return Object.keys(m).map(Number).sort(function (a, b) { return a - b; });
}
function esNum(x) { return typeof x === 'number' && !isNaN(x); }
function limitar(x, lo, hi) { return Math.max(lo, Math.min(hi, Math.round(x))); }
function redondear(x) { return Math.round(x * 4) / 4; }
function fmt(x) { return String(x).replace('.', ','); }
function fechaCorta(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }
</script>
<script>
// ============================================================ conexión con el servidor
// Modo 'gas': la página la sirve Apps Script (google.script.run).
// Modo 'api': la página está alojada fuera (GitHub Pages) y llama a la API de Apps Script con fetch.
var MODO = (typeof google !== 'undefined' && google.script && google.script.run) ? 'gas' : 'api';
var K_CONEX = 'gym_conexion_v1', K_COLA = 'gym_cola_v1', K_EST = 'gym_estado_v1', K_DESC = 'gym_descanso_v1', K_CERR = 'gym_cerrada_v1';

function lsGet(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function conexion() { return lsGet(K_CONEX, {}); }
(function leerHash() {
  var h = location.hash || '', k = /[#&]key=([^&]+)/.exec(h), u = /[#&]api=([^&]+)/.exec(h);
  if (!k && !u) return;
  var c = conexion(); if (k) c.key = decodeURIComponent(k[1]); if (u) c.url = decodeURIComponent(u[1]); lsSet(K_CONEX, c);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
})();
function apiUrl() { return conexion().url || window.GYM_API_URL || ''; }

function call(fn, args) {
  return new Promise(function (res, rej) {
    var req = { fn: fn, args: args || [], key: conexion().key || '' };
    if (MODO === 'gas') { google.script.run.withSuccessHandler(res).withFailureHandler(rej).rpc(req); return; }
    if (!apiUrl()) { rej(new Error('SIN_URL')); return; }
    fetch(apiUrl(), { method: 'POST', body: JSON.stringify(req) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) res(j.result); else rej(new Error(j.error || 'Error del servidor')); })
      .catch(function (e) { rej(new Error(navigator.onLine === false ? 'SIN_RED' : (e.message || 'Error de red'))); });
  });
}
function run(fn, args, ok, ko) {
  call(fn, args).then(ok, function (e) {
    var m = String(e && e.message || e);
    if (/CLAVE|SIN_URL/.test(m)) return pantallaConexion(m);
    if (ko) return ko(e);
    toast(m === 'SIN_RED' ? 'Sin conexión' : 'Error: ' + m, 'err');
  });
}

// ============================================================ estado
var E = null;
var S = { vista: 'hoy', rutina: null, lista: [], cur: null, form: {}, tramo: 1, variante: {}, extra: [] };
var GRUPOS = ['Pecho','Espalda','Hombro','Bíceps','Tríceps','Antebrazo','Cuádriceps','Isquios','Glúteo','Aductor','Gemelo','Abdomen'];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function n2(x) { return x == null || x === '' ? '' : String(Math.round(x * 100) / 100).replace('.', ','); }
function dm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
function toast(t, tipo) { var e = $('toast'); e.textContent = t; e.className = 'toast ' + (tipo || ''); e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(function () { e.style.display = 'none'; }, tipo === 'err' ? 3500 : 1800); }
function ej(id) { return (E && E.ejercicios.filter(function (x) { return x.id === id; })[0]) || { id: id, nombre: id, tipoCarga: 'total', equipo: '' }; }
function vibrar(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// ============================================================ arranque
function cargar(silencioso) {
  var cache = lsGet(K_EST, null);
  if (!E && cache && cache.hoy === hoyLocal()) { E = cache; tomarEstado(); }
  run('getEstado', [], function (e) { E = e; lsSet(K_EST, e); tomarEstado(); vaciarCola(); },
      function (err) { if (!E) $('app').innerHTML = '<div class="card">No se ha podido cargar. ' + esc(err.message) + '<button class="prim ok" onclick="cargar()">Reintentar</button></div>'; else toast('Sin conexión: usando los datos guardados', 'err'); });
}
function hoyLocal() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function tomarEstado() {
  // series en cola (sin enviar) que el servidor aún no conoce
  cola().forEach(function (s) {
    if (s.fecha === E.hoy && !E.hoySets.some(function (x) { return x.clientId === s.clientId; }))
      E.hoySets.push({ clientId: s.clientId, ej: s.ej, peso: s.peso === '' ? null : s.peso, reps: s.reps, tramo: s.tramo, tipo: s.tipo, variante: s.variante, pending: true });
  });
  var cerrada = lsGet(K_CERR, '') === E.hoy;
  if (!S.rutina && E.hoySets.length && !cerrada) { S.rutina = (E.sesionHoy && E.sesionHoy.tipo) || lsGet('gym_rutina_' + E.hoy, 'Libre'); montarLista(); }
  else if (S.rutina) montarLista();
  pintar();
}
window.addEventListener('online', function () { vaciarCola(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { tickDescanso(); vaciarCola(); } });

// ============================================================ cola sin conexión
var enviando = false;
function cola() { return lsGet(K_COLA, []); }
function setCola(c) { lsSet(K_COLA, c); pintarCabecera(); }
function vaciarCola() {
  var c = cola(); if (!c.length || enviando) { pintarCabecera(); return; }
  enviando = true; pintarCabecera();
  var s = c[0];
  call('guardarSerie', [s]).then(function (r) {
    enviando = false;
    var x = E && E.hoySets.filter(function (h) { return h.clientId === s.clientId; })[0];
    if (x) { x.id = r.id; x.pending = false; x.serie = r.serie; }
    setCola(cola().filter(function (q) { return q.clientId !== s.clientId; }));
    if (S.vista === 'hoy') pintar(); vaciarCola();
  }, function (e) {
    enviando = false; pintarCabecera();
    var m = String(e.message || e);
    if (/CLAVE|SIN_URL/.test(m)) return pantallaConexion(m);

}

// ============================================================ cronómetro de descanso
var tInt = null;
function descanso() { return lsGet(K_DESC, null); }
function iniciarDescanso(info) { lsSet(K_DESC, { inicio: Date.now(), info: info }); tickDescanso(); }
function reiniciarDescanso() { var d = descanso(); if (!d) return; d.inicio = Date.now(); lsSet(K_DESC, d); tickDescanso(); vibrar(15); }
function pararDescanso() { lsSet(K_DESC, null); tickDescanso(); }
function segDescanso() { var d = descanso(); return d ? Math.max(0, Math.floor((Date.now() - d.inicio) / 1000)) : null; }
function mmss(s) { return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
function tickDescanso() {
  var d = descanso(), s = segDescanso();
  if (d && s > 3600) { lsSet(K_DESC, null); d = null; }
  document.body.classList.toggle('timer-on', !!d);
  if (!d) { clearInterval(tInt); tInt = null; return; }
  $('tClk').textContent = mmss(s); $('tLbl').textContent = 'Descanso · ' + (d.info || '');
  $('timer').className = s >= 180 ? 'long' : (s >= 120 ? 'mid' : '');
  if (!tInt) tInt = setInterval(tickDescanso, 1000);
}

// ============================================================ lista del día
function montarLista() {
  var ids = [];
  (E.rutinas[S.rutina] || []).forEach(function (r) { ids.push(r.ej); });
  E.hoySets.forEach(function (x) { if (ids.indexOf(x.ej) < 0) ids.push(x.ej); });
  (S.extra || []).forEach(function (x) { if (ids.indexOf(x) < 0) ids.push(x); });
  var hechos = []; E.hoySets.forEach(function (x) { if (hechos.indexOf(x.ej) < 0) hechos.push(x.ej); });
  S.lista = hechos.concat(ids.filter(function (i) { return hechos.indexOf(i) < 0; }));
  if (!S.cur || S.lista.indexOf(S.cur) < 0) S.cur = siguientePendiente() || S.lista[0];
  prepararForm();
}
function setsHoy(id) { return E.hoySets.filter(function (x) { return x.ej === id; }); }
function efectivasHoy(id) { return setsHoy(id).filter(function (x) { return x.tramo === 1 && x.tipo !== 'calentamiento'; }); }
function objetivo(id) {
  var h = E.historial[id], L = h && h.length ? h[h.length - 1] : null;
  var r = (E.rutinas[S.rutina] || []).filter(function (x) { return x.ej === id; })[0];
  return L ? L.sets.length : (r ? r.series : 3);
}
function siguientePendiente() {
  for (var i = 0; i < S.lista.length; i++) if (efectivasHoy(S.lista[i]).length < objetivo(S.lista[i])) return S.lista[i];
  return null;
}
function prepararForm() {
  var id = S.cur; if (!id) return;
  var e = ej(id), hoy = efectivasHoy(id).map(function (x) { return { peso: x.peso, reps: x.reps }; });
  var p = sugerirSerie(E.historial[id] || [], hoy, hoy.length + 1, { repsMin: e.repsMin, repsMax: e.repsMax });
  S.form = { peso: p.peso, reps: p.reps, motivo: p.motivo };
  S.prog = hoy.length === 0 ? sugerirProgresion(E.historial[id] || [], { repsMax: e.repsMax, incremento: E.cfg.incremento }) : null;
  S.tramo = 1;
  if (!S.variante[id]) {
    var u = E.hoySets.slice().reverse().filter(function (x) { return x.ej === id && x.variante; })[0];
    S.variante[id] = u ? u.variante : '';
  }
}

// ============================================================ pintar
var ICON_ATRAS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

}

function pintarSesion() {

      '<div class="row"><div class="t">' + esc(e.nombre) + '</div><span class="badge">' + (done ? '✓ ' : '') + hechas + '/' + obj + '</span></div>';
    var hs = setsHoy(id);

function etiquetaSerie(e, x) {
  return (x.tramo > 1 ? '↳ ' : '') + (e.tipoCarga === 'reps' || e.tipoCarga === 'segs' ? '' : pesoTxt(e, x.peso) + ' × ') + n2(x.reps) + (e.tipoCarga === 'segs' ? ' s' : '');
}
function pesoTxt(e, p) {
  if (p == null || p === '') return '—';

  if (e.tipoCarga === 'asistencia') return '−' + n2(p);
  return n2(p);
}
function unidad(e) { return { lastre: 'kg de lastre', asistencia: 'kg de ayuda', por_mancuerna: 'kg c/u', segs: '', reps: '' }[e.tipoCarga] || 'kg'; }
function paso(e) { return e.equipo === 'Mancuernas' ? 1 : 2.5; }

function panel(e) {
  var id = e.id, h = E.historial[id] || [], L = h.length ? h[h.length - 1] : null;
  var sinPeso = e.tipoCarga === 'reps' || e.tipoCarga === 'segs';
  var p = '<div class="mute" style="margin-top:8px">' + (L ? 'Última vez ' + dm(L.fecha) + ': ' +
          L.sets.map(function (s) { return (sinPeso ? '' : pesoTxt(e, s.peso) + '×') + n2(s.reps); }).join(', ') : 'Primera vez') + '</div>';
  if (e.equipo === 'Polea') {
    p += '<div class="chips">' + ['', 'G', 'N'].map(function (v) {
      return '<button class="chip' + ((S.variante[id] || '') === v ? ' on' : '') + '" onclick="S.variante[\'' + id + '\']=\'' + v + '\';pintar()">' + (v ? (v === 'G' ? 'Polea gris' : 'Polea negra') : 'Sin especificar') + '</button>';
    }).join('') + '</div>';
  }
  p += '<div style="margin-top:10px">';
  if (!sinPeso) p += control('peso', S.form.peso, unidad(e), paso(e));
  p += control('reps', S.form.reps, e.tipoCarga === 'segs' ? 'segundos' : 'reps', 1) + '</div>';
  var n = efectivasHoy(id).length + (S.tramo > 1 ? 0 : 1);
  p += '<button class="prim ok" onclick="guardar()">' + (S.tramo > 1 ? 'Guardar tramo ' + S.tramo + ' (serie ' + (n) + ')' : '✓  Serie ' + n) + '</button>';
  if (S.tramo > 1) p += '<button class="ghost lnk" onclick="S.tramo=1;prepararForm();pintar()">Cancelar tramo</button>';
  p += '<div class="mute" style="margin-top:6px">' + esc(S.form.motivo || '') + '</div>';
  if (S.prog) p += '<button class="hint" onclick="S.form.peso=' + S.prog.peso + ';S.form.reps=' + S.prog.reps + ';S.form.motivo=\'Progresión\';S.prog=null;pintar()">↑ Subir a ' + n2(S.prog.peso) + ' kg × ' + S.prog.reps + ' — ' + esc(S.prog.motivo) + '</button>';
  if (setsHoy(id).length && S.tramo === 1) {
    p += '<div class="row" style="margin-top:6px;justify-content:space-between"><button class="ghost" onclick="masTramo()">+ Tramo (drop)</button>' +
         '<button class="ghost" onclick="deshacer()">Deshacer</button></div>';

}
function control(k, v, lbl, step) {
  return '<div class="ctrl"><button class="step" onclick="mover(\'' + k + '\',' + (-step) + ')" aria-label="menos">−</button>' +
    '<div class="val"><input inputmode="decimal" value="' + n2(v) + '" onchange="S.form.' + k + '=parseFloat(this.value.replace(\',\',\'.\'))"><small>' + esc(lbl) + '</small></div>' +
    '<button class="step" onclick="mover(\'' + k + '\',' + step + ')" aria-label="más">+</button></div>';
}
function mover(k, d) { var v = Number(S.form[k]) || 0; S.form[k] = Math.max(0, Math.round((v + d) * 100) / 100); pintar(); }

// ============================================================ acciones de la sesión
function empezar() {
  S.rutina = S.elegida || E.siguiente; S.extra = []; S.cur = null;
  lsSet('gym_rutina_' + E.hoy, S.rutina); lsSet(K_CERR, '');
  montarLista(); pintar(); window.scrollTo(0, 0);
}
function continuar() { S.rutina = lsGet('gym_rutina_' + E.hoy, (E.sesionHoy && E.sesionHoy.tipo) || 'Libre'); montarLista(); pintar(); verActual(); }
function alInicio() { S.rutina = null; pintar(); window.scrollTo(0, 0); }
function elegir(id) { S.cur = id; prepararForm(); pintar(); verActual(); }
function verActual() { setTimeout(function () { var c = document.querySelector('.ex.cur'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); }

function guardar() {
  var e = ej(S.cur), sinPeso = e.tipoCarga === 'reps' || e.tipoCarga === 'segs';
  var pesoMal = !sinPeso && (S.form.peso === null || S.form.peso === undefined || isNaN(S.form.peso));
  if (!S.form.reps || pesoMal) { toast('Falta ' + (S.form.reps ? 'el peso' : 'las reps'), 'err'); return; }
  var prevTramo1 = efectivasHoy(S.cur).slice(-1)[0];
  var desc = segDescanso();
  var notas = (S.tramo === 1 && desc !== null && desc < 900 && efectivasHoy(S.cur).length + E.hoySets.length > 0) ? 'descanso ' + mmss(desc) : '';
  var s = { clientId: 'c' + Date.now() + Math.random().toString(36).slice(2, 7), fecha: E.hoy, ej: S.cur, variante: S.variante[S.cur] || '',
            peso: sinPeso ? '' : S.form.peso, reps: S.form.reps, tramo: S.tramo, notas: notas,
            tipo: S.tramo > 1 ? (prevTramo1 && prevTramo1.peso === S.form.peso ? 'rest-pause' : 'drop') : 'normal', rutina: S.rutina };
  var nSerie = S.tramo > 1 && prevTramo1 ? (prevTramo1.serie || efectivasHoy(s.ej).length) : efectivasHoy(s.ej).length + 1;
  E.hoySets.push({ clientId: s.clientId, ej: s.ej, peso: s.peso === '' ? null : s.peso, reps: s.reps, tramo: s.tramo, tipo: s.tipo,
                   variante: s.variante, pending: true, serie: nSerie });
  lsSet(K_EST, E);
  setCola(cola().concat([s])); vaciarCola();
  vibrar(30);
  iniciarDescanso(e.nombre + ' · serie ' + nSerie);
  toast(S.tramo > 1 ? 'Tramo guardado' : '✓ Serie ' + nSerie + ' guardada', 'ok');
  if (S.tramo === 1 && efectivasHoy(S.cur).length >= objetivo(S.cur)) {
    var sig = siguientePendiente();
    if (sig) { S.cur = sig; prepararForm(); pintar(); verActual(); toast('Siguiente: ' + ej(sig).nombre, 'ok'); return; }
  }
  prepararForm(); pintar();
}
function masTramo() {
  var last = setsHoy(S.cur).slice(-1)[0]; if (!last) return;
  S.tramo = (last.tramo || 1) + 1;
  S.form = { peso: last.peso, reps: Math.max(1, Math.round((last.reps || 4) / 3)), motivo: 'Tramo ' + S.tramo + ': baja el peso para drop, mismo peso para rest-pause' };
  pintar();
}
function deshacer() {
  var hs = setsHoy(S.cur), x = hs[hs.length - 1]; if (!x) return;
  confirmar('¿Borrar la última serie?', etiquetaSerie(ej(S.cur), x) + ' en ' + ej(S.cur).nombre, 'Borrar', true, function () {
    E.hoySets.splice(E.hoySets.indexOf(x), 1); lsSet(K_EST, E);
    if (x.pending) setCola(cola().filter(function (c) { return c.clientId !== x.clientId; }));
    else run('borrarSerie', [x.id], function () {});
    prepararForm(); pintar(); toast('Serie borrada');
  });
}
function terminar() {
  var series = E.hoySets.filter(function (x) { return x.tramo === 1; });
  if (!series.length) {
    return confirmar('No hay series registradas', 'La sesión está vacía. ¿Volver al inicio?', 'Volver', false, function () { S.rutina = null; pararDescanso(); pintar(); });
  }
  var nEj = S.lista.filter(function (id) { return setsHoy(id).length; }).length;
  confirmar('¿Terminar la sesión?', series.length + ' series · ' + nEj + ' ejercicios', 'Terminar', false, function () {
    pararDescanso();
    var recs = recordsHoy(), pend = cola().length;
    lsSet(K_CERR, E.hoy);
    abrirHoja('<h3>Sesión guardada ✓</h3><p class="mute" style="margin-top:0">' + series.length + ' series · ' + nEj + ' ejercicios</p>' +
      (pend ? '<div class="banner" style="background:var(--warn2);color:var(--warn)">' + pend + ' series pendientes de enviar. Se enviarán solas al recuperar la conexión.</div>' : '') +
      (recs.length ? '<p><b>Récords de fuerza estimada</b></p><ul style="padding-left:20px;margin:0">' + recs.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' : '<p class="mute">Sin récords nuevos hoy.</p>') +
      '<button class="prim ok" onclick="cerrar();S.rutina=null;ir(\'hoy\');cargar(true)">Volver al inicio</button>', true);
  });
}
function cargaEf(e, p) { return e.tipoCarga === 'lastre' ? E.cfg.pesoCorporal + (p || 0) : e.tipoCarga === 'asistencia' ? E.cfg.pesoCorporal - (p || 0) : p; }
function recordsHoy() {
  var recs = [];
  S.lista.forEach(function (id) {
    var e = ej(id), best = null, prev = 0;
    efectivasHoy(id).forEach(function (x) { var v = e1rm(cargaEf(e, x.peso), x.reps); if (v && (!best || v > best)) best = v; });
    (E.historial[id] || []).forEach(function (s) { s.sets.forEach(function (x) { var v = e1rm(cargaEf(e, x.peso), x.reps); if (v && v > prev) prev = v; }); });
    if (best && prev && best > prev) recs.push(e.nombre + ': ' + n2(best) + ' kg (antes ' + n2(prev) + ')');
  });
  return recs;
}
function descartar() {

  confirmar('¿Descartar la sesión de hoy?', n ? 'Se borrarán las ' + n + ' series registradas hoy. No se puede deshacer desde la app.' : 'No hay series registradas.', 'Descartar', true, function () {
    setCola(cola().filter(function (s) { return s.fecha !== E.hoy; }));
    var hayEnServidor = E.hoySets.some(function (x) { return !x.pending; });
    E.hoySets = []; S.rutina = null; S.extra = []; pararDescanso(); lsSet(K_EST, E); lsSet(K_CERR, '');
    pintar(); toast('Sesión descartada');
    if (hayEnServidor) run('descartarSesion', [E.hoy], function () {});
  });
}

// ============================================================ progreso
var chart = null;
function pintarProgreso() {
  cabecera('Progreso');
  var sel = S.progEj || S.cur || (E.ejercicios.filter(function (e) { return e.activo; })[0] || {}).id;
  var opts = E.ejercicios.filter(function (e) { return e.ultima; }).sort(function (a, b) { return (b.activo - a.activo) || a.nombre.localeCompare(b.nombre); });
  $('app').innerHTML = '<div class="card"><select onchange="S.progEj=this.value;pintar()">' + opts.map(function (e) { return '<option value="' + esc(e.id) + '"' + (e.id === sel ? ' selected' : '') + '>' + esc(e.nombre) + '</option>'; }).join('') + '</select>' +
    '<div id="kpis" class="row" style="justify-content:space-between;margin:14px 2px"><span class="mute">Cargando…</span></div><canvas id="cv" height="260"></canvas><div class="mute" style="margin-top:8px">Fuerza estimada (Epley) y peso de la serie más pesada por sesión.</div></div>';
  run('getProgreso', [sel], function (r) {
    if (S.vista !== 'prog') return;
    var p = r.puntos.filter(function (x) { return x.e1rm || x.top; });
    if (!p.length) { $('kpis').innerHTML = '<span class="mute">Sin datos</span>'; return; }
    var best = Math.max.apply(null, p.map(function (x) { return x.e1rm || 0; })), last = p[p.length - 1];
    $('kpis').innerHTML = kpi('Mejor e1RM', n2(best)) + kpi('Último', n2(last.e1rm)) + kpi('Sesiones', p.length);
    if (chart) chart.destroy();
    if (typeof Chart === 'undefined') return;
    var css = getComputedStyle(document.documentElement);
    chart = new Chart($('cv'), { type: 'line', data: { labels: p.map(function (x) { return dm(x.fecha) + '/' + x.fecha.slice(2, 4); }),
      datasets: [{ label: 'e1RM (kg)', data: p.map(function (x) { return x.e1rm; }), borderColor: css.getPropertyValue('--acc').trim(), pointRadius: 2, tension: .2, spanGaps: true },
                 { label: 'Peso top (kg)', data: p.map(function (x) { return x.top; }), borderColor: '#e07b39', borderDash: [4, 4], pointRadius: 0, tension: .2, spanGaps: true }] },
      options: { plugins: { legend: { position: 'bottom' } }, scales: { x: { ticks: { maxTicksLimit: 6 } } } } });
  });
}
function kpi(l, v) { return '<div><div class="mute">' + l + '</div><div style="font-size:22px;font-weight:700">' + v + '</div></div>'; }

// ============================================================ historial
function pintarHistorial() {
  cabecera('Historial');
  $('app').innerHTML = '<div class="loading">Cargando…</div>';
  run('getHistorial', [10], function (ses) {
    if (S.vista !== 'hist') return;
    $('app').innerHTML = '<p class="mute" style="margin:8px 4px">Toca una serie para corregirla o borrarla.</p>' + (ses.map(function (s) {
      var por = {}; s.sets.forEach(function (x) { (por[x.ej] = por[x.ej] || []).push(x); });
      return '<div class="card"><b>' + s.fecha.split('-').reverse().join('/') + '</b>' + Object.keys(por).map(function (id) {
        var e = ej(id);
        return '<div style="margin-top:8px">' + esc(e.nombre) + '<div class="sets">' + por[id].map(function (x) {
          return '<span class="set" onclick="editar(\'' + x.id + '\',\'' + id + '\',' + (x.peso == null ? 'null' : x.peso) + ',' + x.reps + ')">' + etiquetaSerie(e, x) + '</span>';
        }).join('') + '</div></div>';
      }).join('') + '</div>';
    }).join('') || '<p class="mute">Sin sesiones.</p>');
  });
}
function editar(id, ejId, peso, reps) {
  var e = ej(ejId), sinPeso = e.tipoCarga === 'reps' || e.tipoCarga === 'segs';
  abrirHoja('<h3>' + esc(e.nombre) + '</h3><div class="row">' +
    (sinPeso ? '' : '<div style="flex:1"><label class="f">' + esc(unidad(e)) + '</label><input type="text" id="ep" inputmode="decimal" value="' + n2(peso) + '"></div>') +
    '<div style="flex:1"><label class="f">' + (e.tipoCarga === 'segs' ? 'segundos' : 'reps') + '</label><input type="text" id="er" inputmode="numeric" value="' + n2(reps) + '"></div></div>' +
    '<div class="pair"><button onclick="cerrar()">Cancelar</button><button class="prim" onclick="guardarEdicion(\'' + id + '\')">Guardar</button></div>' +
    '<button class="ghost danger lnk" style="margin-top:10px" onclick="borrarHist(\'' + id + '\')">Borrar serie</button>');
}
function guardarEdicion(id) {
  var p = $('ep') ? parseFloat($('ep').value.replace(',', '.')) : '', r = parseFloat($('er').value.replace(',', '.'));
  if (!r) { toast('Reps no válidas', 'err'); return; }
  run('editarSerie', [id, p, r], function () { cerrar(); toast('✓ Cambios guardados', 'ok'); pintar(); });
}
function borrarHist(id) {
  confirmar('¿Borrar esta serie?', 'Se marcará como borrada en la hoja.', 'Borrar', true, function () {
    run('borrarSerie', [id], function () { toast('Serie borrada'); pintar(); });
  });
}

// ============================================================ conexión (solo app instalada fuera de Google)
function pantallaConexion(motivo) {
  cabecera('Conectar');
  var c = conexion();
  $('app').innerHTML = '<div class="card"><h3 style="margin:0 0 6px">Conecta la app con tu hoja</h3>' +
    '<p class="mute" style="margin-top:0">' + (motivo && /CLAVE/.test(motivo) && c.key ? 'La clave no es correcta. ' : '') +
    'En el Sheet <b>Gym v2</b>, menú <b>Gym → Conectar el móvil</b>, copia la clave aquí. Solo hay que hacerlo una vez.</p>' +
    (window.GYM_API_URL || MODO === 'gas' ? '' : '<label class="f">URL de la API (termina en /exec)</label><input type="text" id="cu" value="' + esc(c.url || '') + '">') +
    '<label class="f">Clave</label><input type="text" id="ck" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" value="' + esc(c.key || '') + '">' +
    '<button class="prim ok" onclick="guardarConex()">Conectar</button></div>';
}
function guardarConex() {
  var c = conexion();
  if ($('cu')) c.url = $('cu').value.trim();
  c.key = $('ck').value.trim().toUpperCase();
  lsSet(K_CONEX, c); toast('Conectando…'); E = null; lsSet(K_EST, null); cargar();
}

tickDescanso();
cargar();
</script>
